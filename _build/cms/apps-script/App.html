let busy = 0;
function setBusy(d) { busy += d; $('#loading').hidden = busy <= 0; }
function call(action, args) {
  setBusy(1);
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler(r => {
        setBusy(-1);
        if (!r) return rej(new Error('No response from server'));
        if (r.ok) return res(r.data);
        if (r.error === 'AUTH') { toast(r.message, 'err'); logout(true); return rej(new Error(r.message)); }
        rej(new Error(r.error));
      })
      .withFailureHandler(e => { setBusy(-1); rej(e instanceof Error ? e : new Error(String(e && e.message || e))); })
      .rpc(S.token, action, args || {});
  });
}
const fail = e => toast(e.message || String(e), 'err');

/* ---------------- toast / modal ---------------- */
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 7000 : 4200);
}
function modal(html, cls) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${cls || ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape' && document.body.lastElementChild === bg) close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  bg.addEventListener('click', e => { if (e.target.closest('[data-close]')) { e.preventDefault(); close(); } });
  return { el: bg, close };
}
function confirmBox(title, html, okLabel, danger) {
  return new Promise(res => {
    const m = modal(`<div class="modal-h"><h2>${esc(title)}</h2><button class="icon-btn" data-close>${I.x}</button></div>
      <div class="modal-b">${html}</div>
      <div class="modal-f"><button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(okLabel || 'OK')}</button></div>`);
    let done = false;
    $('[data-ok]', m.el).onclick = () => { done = true; m.close(); res(true); };
    new MutationObserver((_, o) => { if (!document.body.contains(m.el)) { o.disconnect(); if (!done) res(false); } }).observe(document.body, { childList: true });
  });
}

function src(img, w) {
  if (!img) return '';

  return S.d.settings.site_url.replace(/\/$/, '') + img.url;
}
function index() {
  const d = S.d;
  S.img = {}; d.images.forEach(i => { S.img[i.image_id] = i; });
  S.cat = {}; d.categories.forEach(c => { S.cat[c.code] = c; });
  S.subs = {}; d.subcategories.forEach(s => { (S.subs[s.category_code] = S.subs[s.category_code] || []).push(s); });
  Object.values(S.subs).forEach(l => l.sort((a, b) => Number(a.sort) - Number(b.sort)));
  S.prj = {}; d.projects.forEach(p => { S.prj[p.project_no] = p; });
  S.prjImgs = {}; d.projectImages.forEach(r => { (S.prjImgs[r.project_no] = S.prjImgs[r.project_no] || []).push(r); });
  Object.values(S.prjImgs).forEach(l => l.sort((a, b) => Number(a.sort) - Number(b.sort)));
  S.use = {};
  const u = id => (S.use[id] = S.use[id] || { slots: [], pages: [], featured: [], gallery: [] });
  d.slots.forEach(s => { if (s.image_id) { const x = u(s.image_id); x.slots.push(s.slot_key); if (!x.pages.includes(s.page)) x.pages.push(s.page); } });
  d.projects.forEach(p => { if (p.featured_image_id) u(p.featured_image_id).featured.push(p.project_no); });
  d.projectImages.forEach(r => u(r.image_id).gallery.push(r.project_no));
  S.pages = []; const seen = {};
  d.slots.forEach(s => { if (!seen[s.page]) { seen[s.page] = { page: s.page, url: s.page_url, slots: [] }; S.pages.push(seen[s.page]); } seen[s.page].slots.push(s); });
  S.pend = new Set(d.pending.slots); S.pendPrj = new Set(d.pending.projects);
  S.sel.forEach(id => { if (!S.img[id]) S.sel.delete(id); });
}
const catName = code => (S.cat[code] || {}).name || code;
const used = id => { const x = S.use[id]; return x ? x.slots.length + x.featured.length + x.gallery.length : 0; };
function nextIdFor(code) {
  const c = S.d.counters.find(x => x.prefix === code);

  S.d.images.forEach(i => { if (i.prefix === code) max = Math.max(max, i.seq); });

}
const fmtId = (code, n) => code + '-' + String(n).padStart(3, '0');

}
function siteLink(pageUrl, extra) {

  return base + path + (extra ? '?' + extra : '') + (hash ? '#' + hash : '');

function catOptions(cur, blank) { return (blank ? opt('', blank, cur) : '') + S.d.categories.map(c => opt(c.code, c.code + ' — ' + c.name, cur)).join(''); }

    <div class="login-body">
      <div><h1>Image &amp; Website CMS</h1><p>Sign in to manage every image on subhainfra.com.</p></div>

      <button class="btn btn-primary" type="submit" style="padding:11px">Sign in</button>
    </div></form></div>`;

    e.preventDefault();
    const f = e.target, b = $('button', f);
    b.disabled = true; b.innerHTML = '<span class="spin"></span> Signing in…';

}
function logout(expired) {
  if (S.token && !expired) google.script.run.logout(S.token);

}
async function boot() {
  $('#app').innerHTML = '<div class="empty-state" style="padding-top:20vh"><span class="spin"></span><br><br>Loading the image library…</div>';

    S.d = await call('bootstrap');
    S.user = S.d.user;
    index();
    renderShell();
    go(S.view);
  } catch (e) { if (S.token) showLogin(e.message); }
}

/* ---------------- Image library ---------------- */
function filteredImages() {
  const f = S.f, q = f.q.trim().toLowerCase();
  const prjSet = f.prj ? new Set((S.prjImgs[f.prj] || []).map(r => r.image_id).concat(S.prj[f.prj] && S.prj[f.prj].featured_image_id ? [S.prj[f.prj].featured_image_id] : [])) : null;
  let list = S.d.images.filter(i => {
    if (S.only && !S.only.has(i.image_id)) return false;
    if (f.cat && i.category_code !== f.cat) return false;
    if (f.sub && i.subcategory !== f.sub) return false;
    if (prjSet && !(prjSet.has(i.image_id) || i.project_no === f.prj)) return false;
    if (f.status === 'placeholder') { if (!/PLACEHOLDER/.test(i.notes)) return false; }
    else if (f.status === 'unused') { if (used(i.image_id)) return false; }
    else if (f.status === 'all') { /* everything */ }
    else if (f.status) { if (i.status !== f.status) return false; }
    else if (i.status === 'archived') return false;
    if (f.page && !((S.use[i.image_id] || {}).pages || []).includes(f.page)) return false;
    if (q) {
      const hay = (i.image_id + ' ' + i.display_name + ' ' + i.original_filename + ' ' + i.subcategory + ' ' + ((S.use[i.image_id] || {}).slots || []).join(' ')).toLowerCase();
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const catSort = c => Number((S.cat[c] || {}).sort) || 99;
  if (f.sort === 'new') list.sort((a, b) => String(b.upload_date).localeCompare(String(a.upload_date)) || b.seq - a.seq);
  else if (f.sort === 'id') list.sort((a, b) => a.prefix.localeCompare(b.prefix) || a.seq - b.seq);
  else if (f.sort === 'name') list.sort((a, b) => String(a.display_name).localeCompare(String(b.display_name)));
  else list.sort((a, b) => catSort(a.category_code) - catSort(b.category_code) || a.display_order - b.display_order || a.seq - b.seq);
  return list;
}

/* ---------------- Upload ---------------- */
function openUpload(fileList) {
  const st = S.d.settings;
  const U = { files: [], cat: S.f.cat || '', sub: S.f.sub || '', prj: '', gallery: true, role: 'gallery', status: 'active', convert: true, running: false, done: [] };
  const m = modal(`<div class="modal-h"><h2>Upload images</h2><button class="icon-btn" data-close>${I.x}</button></div>
    <div class="modal-b">
      <div class="drop-zone" id="u-drop"><b>Drop photos here</b> or click to choose · JPG, PNG or WebP · many at once</div>
      <div class="up-list" id="u-list"></div>
      <div class="grid cols-2">
        <label class="f"><span>Main category <em>*</em></span><select class="in" id="u-cat">${catOptions(U.cat, '— choose —')}</select></label>
        <label class="f"><span>Subcategory</span><select class="in" id="u-sub"></select></label>
        <label class="f"><span>Project (optional)</span><select class="in" id="u-prj">${prjOptions('', '— none —')}</select></label>
        <label class="f"><span>Status</span><select class="in" id="u-status">${opt('active', 'Active', 'active')}${opt('inactive', 'Inactive (hidden from website)', '')}</select></label>
      </div>
      <div id="u-prj-opts" hidden class="toolbar" style="margin:0"><label class="chk"><input type="checkbox" id="u-gal" checked> Add to the project's photo gallery as</label><select class="in" id="u-role" style="min-width:120px">${opt('gallery', 'Gallery photo', 'gallery')}${opt('before', 'Before', '')}${opt('after', 'After', '')}</select></div>
      <label class="chk"><input type="checkbox" id="u-conv" checked> Optimise: convert to WebP and resize to max ${esc(st.upload_max_px)}px (recommended — about 70% smaller, same visual quality)</label>
      <div class="alert info" id="u-ids">${I.info}<div>Choose a category to see the image numbers these photos will get.</div></div>
    </div>
    <div class="modal-f"><span class="left small muted" id="u-sum"></span><button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="u-go" disabled>${I.up} Upload</button></div>`, 'mid');
  const el = m.el, input = $('#file-upload');
  const drawSub = () => { $('#u-sub').innerHTML = U.cat ? subOptions(U.cat, U.sub, '— none —') : '<option value="">Choose a category first</option>'; };
  const drawIds = () => {
    const n = U.files.filter(f => !f.id).length;
    $('#u-ids').innerHTML = U.cat && n ? `${I.info}<div>These ${n} photo${n > 1 ? 's' : ''} will be numbered <b class="mono">${fmtId(U.cat, nextIdFor(U.cat))}</b>${n > 1 ? ` to <b class="mono">${fmtId(U.cat, nextIdFor(U.cat) + n - 1)}</b>` : ''} (exact numbers are confirmed by the server).</div>` : `${I.info}<div>Choose a category to see the image numbers these photos will get.</div>`;
    $('#u-go').disabled = U.running || !U.cat || !n;
    $('#u-sum').textContent = U.files.length ? U.files.length + ' file' + (U.files.length > 1 ? 's' : '') + ' · ' + kb(U.files.reduce((a, f) => a + f.file.size, 0)) : '';
  };
  const drawList = () => {
    $('#u-list').innerHTML = U.files.map((f, k) => `<div class="up-row"><img src="${f.url}" alt=""><div style="display:grid;gap:4px"><input class="in" data-k="${k}" value="${esc(f.name)}" ${f.id || U.running ? 'disabled' : ''} placeholder="Display name"><span class="small muted">${esc(f.file.name)} · ${kb(f.file.size)}</span></div><div class="st ${f.cls || ''}">${f.status || (U.running ? '' : `<button class="icon-btn" data-rm="${k}" title="Remove">${I.x}</button>`)}</div></div>`).join('');
    drawIds();
  };
  const add = files => {
    [...files].forEach(file => {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { toast(esc(file.name) + ': only JPG, PNG or WebP', 'err'); return; }
      U.files.push({ file, url: URL.createObjectURL(file), name: file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim() });
    });
    drawList();
  };
  drawSub(); if (fileList) add(fileList); else drawList();
  $('#u-drop', el).onclick = () => { input.value = ''; input.onchange = () => add(input.files); input.click(); };
  const dz = $('#u-drop', el);
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('on'); };
  dz.ondragleave = () => dz.classList.remove('on');
  dz.ondrop = e => { e.preventDefault(); e.stopPropagation(); dz.classList.remove('on'); add(e.dataTransfer.files); };
  $('#u-cat', el).onchange = e => { U.cat = e.target.value; U.sub = ''; drawSub(); drawIds(); };
  $('#u-sub', el).onchange = e => { U.sub = e.target.value; };
  $('#u-prj', el).onchange = e => { U.prj = e.target.value; $('#u-prj-opts').hidden = !U.prj; };

    const sh = $('#u-show', el);

    toast(ok + ' image' + (ok === 1 ? '' : 's') + ' uploaded' + (ok ? ': ' + esc(U.done[0]) + (ok > 1 ? ' … ' + esc(U.done[ok - 1]) : '') : ''), bad ? 'err' : 'ok');

function readAsDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read file')); r.readAsDataURL(blob); }); }
function loadImg(url) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('Not a readable image')); im.src = url; }); }
const canvasBlob = (cv, type, q) => new Promise(r => cv.toBlob(r, type, q));
async function processFile(file, o) {
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);
    const w = im.naturalWidth, h = im.naturalHeight;
    const keep = async () => ({ data: await readAsDataURL(file), mime: file.type, width: w, height: h, bytes: file.size });
    if (!o.convert) return keep();
    const sc = Math.min(1, o.max / Math.max(w, h)), cw = Math.round(w * sc), ch = Math.round(h * sc);
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; cx.drawImage(im, 0, 0, cw, ch);
    let blob = await canvasBlob(cv, 'image/webp', o.q);
    if (!blob || blob.type !== 'image/webp') blob = await canvasBlob(cv, file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.9);   // browsers without WebP encoding (older Safari)
    if (!blob) return keep();
    if (sc === 1 && file.size <= blob.size) return keep();   // original is already smaller
    return { data: await readAsDataURL(blob), mime: blob.type, width: cw, height: ch, bytes: blob.size };
  } finally { URL.revokeObjectURL(url); }
}

  };
  const drawPhotos = () => {
    $('#pj-photos', el).innerHTML = photos.map((p, k) => { const i = S.img[p.image_id]; return `<div class="prj-ph" draggable="true" data-k="${k}"><span class="grip">${I.grip}</span>${i ? `<img src="${esc(src(i, 200))}" alt="">` : '<div></div>'}<div class="small"><span class="id">${esc(p.image_id)}</span><br>${esc(i ? i.display_name : 'missing')}</div><select class="in" data-role="${k}">${opt('gallery', 'Gallery', p.role)}${opt('before', 'Before', p.role)}${opt('after', 'After', p.role)}</select><button class="icon-btn" data-rm="${k}" title="Remove">${I.x}</button></div>`; }).join('') || '<div class="small muted">No photos yet. The page keeps its current gallery until you add some.</div>';
  };
  drawFeat(); drawPhotos();
  el.addEventListener('click', e => {
    if (e.target.closest('[data-pj-feat]')) openPicker({ title: 'Featured image for ' + (P.name || 'project'), current: P.featured_image_id, cat: (S.img[P.featured_image_id] || {}).category_code || '', onPick: id => { P.featured_image_id = id; drawFeat(); } });
    const rm = e.target.closest('[data-rm]'); if (rm) { photos.splice(Number(rm.dataset.rm), 1); drawPhotos(); }
  });
  $('#pj-photos', el).addEventListener('change', e => { const k = e.target.dataset.role; if (k != null) photos[k].role = e.target.value; });
  let dragK = null;
  $('#pj-photos', el).addEventListener('dragstart', e => { const r = e.target.closest('.prj-ph'); if (r) { dragK = Number(r.dataset.k); e.dataTransfer.setData('text/plain', 'PJ'); } });
  $('#pj-photos', el).addEventListener('dragover', e => { const r = e.target.closest('.prj-ph'); if (r && dragK != null) { e.preventDefault(); $$('.prj-ph', el).forEach(x => x.classList.toggle('drag-over', x === r)); } });
  $('#pj-photos', el).addEventListener('drop', e => { const r = e.target.closest('.prj-ph'); if (!r || dragK == null) return; e.preventDefault(); const to = Number(r.dataset.k); const [it] = photos.splice(dragK, 1); photos.splice(to, 0, it); dragK = null; drawPhotos(); });
  $('#pj-add', el).onclick = () => openPicker({ title: 'Add photos to ' + (P.name || 'project'), multi: true, cat: 'PROJECT', selected: [], onPick: ids => { ids.forEach(id => { if (!photos.some(p => p.image_id === id)) photos.push({ image_id: id, role: 'gallery' }); }); drawPhotos(); } });
  $('#pj-save', el).onclick = async () => {
    const f = $('#pj', el); if (!f.name.value.trim()) { toast('Project name is required', 'err'); return; }
    const data = { project_no: P.project_no, name: f.name.value.trim(), category: f.category.value, location: f.location.value, year: f.year.value, status: f.status.value, slug: f.slug.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, ''), description: f.description.value, featured: f.featured.checked, published: f.published.checked, featured_image_id: P.featured_image_id };
    try {
      const r = await call('saveProject', { project: data });
      await call('setProjectImages', { project_no: r.project_no, items: photos });
      m.close(); toast(r.project_no + ' saved as draft — publish to update the website', 'ok'); refresh();
    } catch (e) { fail(e); }
  };
  const del = $('#pj-del', el);
  if (del) del.onclick = async () => { if (await confirmBox('Delete ' + no + '?', '<p>The project record and its photo list are removed. The images stay in the library. The project number is never reused.</p>', 'Delete project', true)) { call('deleteProject', { project_no: no }).then(() => { m.close(); toast(no + ' deleted', 'ok'); refresh(); }).catch(fail); } };
}

/* ---------------- Publish & preview ---------------- */
async function doPublish() {
  const n = S.d.pending.count;
  const ok = await confirmBox('Publish to the live website?', `<p><b>${n} change${n === 1 ? '' : 's'}</b> will go live on <b>${esc(S.d.settings.site_url)}</b>. New visitors see them immediately; returning visitors within about 10 minutes.</p>`, 'Publish now');
  if (!ok) return;
  try { const r = await call('publish'); toast(`Published v${r.v} — the website is updated.`, 'ok'); refresh(); } catch (e) { fail(e); }
}
function preview() {
  window.open(siteLink('/', 'cms_preview=' + encodeURIComponent(S.token)), '_blank');
  toast('Preview opened in a new tab. Browse any page — only your browser sees the drafts.');
}

/* =====================================================================
   EVENTS
   ===================================================================== */
const ACT = {
  nav: t => { S.only = null; go(t.dataset.v); },
  logout: () => logout(),
  upload: () => openUpload(),
  more: () => { S.limit += 120; renderView(); },
  reorder: () => { S.reorder = !S.reorder; if (S.reorder) S.f.sort = 'order'; renderView(); },
  'save-order': () => { const ids = $$('#cards .card').map(c => c.dataset.id); call('setOrder', { ids }).then(() => { toast('Order saved', 'ok'); S.reorder = false; refresh(); }).catch(fail); },
  'clear-only': () => { S.only = null; renderView(); },
  'lib-filter': t => { S.only = null; S.f = { q: '', cat: '', sub: '', prj: '', page: '', status: '', sort: 'order' }; S.f[t.dataset.k] = t.dataset.val; go('library'); },
  preview: t => openLightbox(t.dataset.id),
  edit: t => openEdit(t.dataset.id),
  replace: t => replaceImage(t.dataset.id),
  delete: t => deleteImages([t.dataset.id]),
  'bulk-delete': () => deleteImages([...S.sel]),
  'place-image': t => openPlaceImage(t.dataset.id),
  'sel-none': () => { S.sel.clear(); renderView(); },
  'bulk-cat': () => {
    const cat = $('#b-cat').value, sub = $('#b-sub').value; if (!cat) { toast('Choose a category', 'err'); return; }
    call('bulkUpdate', { ids: [...S.sel], fields: { category_code: cat, subcategory: sub } }).then(r => { toast(r.updated + ' images moved to ' + esc(catName(cat)) + (sub ? ' › ' + esc(sub) : '') + ' (IDs unchanged)', 'ok'); refresh(); }).catch(fail);
  },
  'bulk-status': t => call('bulkUpdate', { ids: [...S.sel], fields: { status: t.dataset.val } }).then(r => { toast(r.updated + ' images set to ' + t.dataset.val, 'ok'); refresh(); }).catch(fail),
  'bulk-prj': async () => {
    const no = $('#b-prj').value; if (!no) { toast('Choose a project', 'err'); return; }
    const cur = (S.prjImgs[no] || []).map(r => ({ image_id: r.image_id, role: r.role }));
    [...S.sel].forEach(id => { if (!cur.some(c => c.image_id === id)) cur.push({ image_id: id, role: 'gallery' }); });
    try { await call('bulkUpdate', { ids: [...S.sel], fields: { project_no: no } }); await call('setProjectImages', { project_no: no, items: cur }); toast('Added to ' + no + ' gallery', 'ok'); refresh(); } catch (e) { fail(e); }
  },
  download: () => {
    toast('Preparing ZIP…');
    call('downloadZip', { ids: [...S.sel] }).then(r => {
      const bin = atob(r.data), arr = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: 'application/zip' })); a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
    }).catch(fail);
  },
  page: t => { S.page = t.dataset.page || null; renderNav(); renderTop(); renderView(); window.scrollTo(0, 0); },
  tray: () => { S.tray = !S.tray; renderView(); },
  'pick-slot': t => {
    const s = S.d.slots.find(x => x.slot_key === t.dataset.key); const cur = s.image_id ? S.img[s.image_id] : null;
    openPicker({ title: 'Choose image for ' + s.slot_key, current: s.image_id, minW: s.recommended_w, cat: cur ? cur.category_code : '', hint: `<b>${esc(s.page)}</b> · ${esc(s.section)} · ${esc(s.label)} — best size ${s.recommended_w}×${s.recommended_h}px`, onPick: id => assign(s.slot_key, id) });
  },
  'clear-slot': async t => { if (await confirmBox('Clear ' + t.dataset.key + '?', '<p>The website will show the built-in image for this spot (after publishing). The image itself stays in the library.</p>', 'Clear placement')) assign(t.dataset.key, ''); },
  'goto-slot': t => { const s = S.d.slots.find(x => x.slot_key === t.dataset.key); if (!s) return; $$('.modal-bg').forEach(x => x.remove()); S.focusSlot = s.slot_key; go('placements', { page: s.page }); },
  'prj-new': () => openProject(null),
  guide: t => {
    const page = t.dataset.page, sec = t.dataset.sec;
    if (page === '__services') { go('services'); return; }
    if (page === 'Team') { go('team'); return; }
    const first = sec ? S.d.slots.find(s => s.page === page && s.section === sec) : null;
    if (first) S.focusSlot = first.slot_key;
    go('placements', { page });
  },
  'enq-load': () => loadEnquiries(),
  'enq-filter': t => { S.enqF = t.dataset.val; drawEnquiries(); },
  'prj-edit': t => openProject(t.dataset.no),
  'cat-edit': t => { const c = S.cat[t.dataset.code]; const n = prompt('Category name for ' + c.code, c.name); if (n && n !== c.name) call('saveCategory', { code: c.code, name: n, group: c.group, service_url: c.service_url }).then(() => { toast('Renamed', 'ok'); refresh(); }).catch(fail); },
  'sub-edit': t => { const n = prompt('Rename subcategory (images keep it)', t.dataset.name); if (n && n !== t.dataset.name) call('saveSubcategory', { id: t.dataset.id, category_code: t.dataset.code, name: n }).then(() => { toast('Renamed', 'ok'); refresh(); }).catch(fail); },
  'sub-del': async t => { if (await confirmBox('Delete subcategory?', '<p>Only possible when no image uses it.</p>', 'Delete', true)) call('deleteSubcategory', { id: t.dataset.id }).then(() => { toast('Deleted', 'ok'); refresh(); }).catch(fail); },
  publish: () => doPublish(),
  'preview-site': () => preview(),
  copy: t => { navigator.clipboard.writeText(t.dataset.text).then(() => toast('Copied', 'ok'), () => prompt('Copy this:', t.dataset.text)); },
  'admins-load': () => call('listAdmins').then(l => { $('#admins').innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Active</th><th>Last login</th><th></th></tr></thead><tbody>${l.map(a => `<tr><td>${esc(a.email)}</td><td>${esc(a.name)}</td><td>${esc(a.role)}</td><td>${a.active ? '<span class="chip ok">active</span>' : '<span class="chip">disabled</span>'}</td><td class="small">${fmtTime(a.last_login)}</td><td>${a.email !== S.user.email ? `<button class="btn btn-sm" data-act="admin-toggle" data-email="${esc(a.email)}" data-name="${esc(a.name)}" data-role="${esc(a.role)}" data-on="${a.active ? 1 : 0}">${a.active ? 'Disable' : 'Enable'}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`; }).catch(fail),
  'admin-toggle': t => call('saveAdmin', { email: t.dataset.email, name: t.dataset.name, role: t.dataset.role, active: t.dataset.on !== '1' }).then(() => { toast('Updated', 'ok'); ACT['admins-load'](); }).catch(fail),
  'audit-load': () => call('auditLog').then(l => { $('#audit').innerHTML = `<div class="tbl-wrap" style="max-height:420px"><table class="tbl"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${l.map(a => `<tr><td class="small" style="white-space:nowrap">${fmtTime(a.time)}</td><td class="small">${esc(String(a.user).split('@')[0])}</td><td><span class="chip">${esc(a.action)}</span></td><td class="small">${esc(a.details)}</td></tr>`).join('')}</tbody></table></div>`; }).catch(fail)
};
const CHG = {
  'enq-status': t => call('updateEnquiry', { id: t.dataset.id, status: t.value }).then(r => { const q = (S.enq || []).find(x => x.id === r.id); if (q) Object.assign(q, r); toast(esc(r.id) + ' → ' + esc(r.status), 'ok'); S.d.enquiries.fresh = (S.enq || []).filter(x => x.status === 'New').length; renderNav(); drawEnquiries(); }).catch(fail),
  'enq-notes': t => call('updateEnquiry', { id: t.dataset.id, notes: t.value }).then(r => { const q = (S.enq || []).find(x => x.id === r.id); if (q) Object.assign(q, r); toast('Notes saved for ' + esc(r.id), 'ok'); }).catch(fail),
  f: t => { S.f[t.dataset.k] = t.value; if (t.dataset.k === 'cat') S.f.sub = ''; S.limit = 120; renderView(); },
  sel: t => { t.checked ? S.sel.add(t.dataset.id) : S.sel.delete(t.dataset.id); renderView(); },
  'sel-all': t => { filteredImages().forEach(i => t.checked ? S.sel.add(i.image_id) : S.sel.delete(i.image_id)); renderView(); },
  status: t => call('updateImage', { image_id: t.dataset.id, fields: { status: t.checked ? 'active' : 'inactive' } }).then(() => { toast(t.dataset.id + (t.checked ? ' activated' : ' deactivated — hidden from the website after publishing'), 'ok'); refresh(); }).catch(e => { t.checked = !t.checked; fail(e); }),
  'prj-flag': t => { const p = {}; p.project_no = t.dataset.no; p[t.dataset.k] = t.checked; call('saveProject', { project: p }).then(() => { toast(t.dataset.no + ' ' + t.dataset.k + ': ' + (t.checked ? 'on' : 'off') + ' (draft)', 'ok'); refresh(); }).catch(e => { t.checked = !t.checked; fail(e); }); }
};
let qTimer;
const INP = { q: t => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.f.q = t.value; S.limit = 120; const pos = t.selectionStart; renderView(); const i = $('[data-inp="q"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 220); } };

document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t, e); } });
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); });
document.addEventListener('input', e => { const t = e.target.closest('[data-inp]'); if (t && INP[t.dataset.inp]) INP[t.dataset.inp](t, e); });
// drag an image from the tray onto a placement
document.addEventListener('dragstart', e => { const t = e.target.closest && e.target.closest('[data-drag-img]'); if (t) e.dataTransfer.setData('text/plain', 'IMG:' + t.dataset.dragImg); });
document.addEventListener('dragover', e => {
  const s = e.target.closest && e.target.closest('[data-drop-slot]');
  if (s) { e.preventDefault(); $$('.slot.drop').forEach(x => x !== s && x.classList.remove('drop')); s.classList.add('drop'); return; }
  if (S.view === 'library' && !S.reorder && e.dataTransfer && [...e.dataTransfer.types].includes('Files') && !$('.modal-bg')) { e.preventDefault(); $('#drop-overlay').hidden = false; }
});
document.addEventListener('dragleave', e => { const s = e.target.closest && e.target.closest('[data-drop-slot]'); if (s && !s.contains(e.relatedTarget)) s.classList.remove('drop'); if (!e.relatedTarget) $('#drop-overlay').hidden = true; });
document.addEventListener('drop', e => {
  $('#drop-overlay').hidden = true;
  const s = e.target.closest && e.target.closest('[data-drop-slot]');
  if (s) { e.preventDefault(); s.classList.remove('drop'); const d = e.dataTransfer.getData('text/plain'); if (d.indexOf('IMG:') === 0) assign(s.dataset.dropSlot, d.slice(4)); return; }
  if (S.view === 'library' && e.dataTransfer.files.length && !$('.modal-bg')) { e.preventDefault(); openUpload(e.dataTransfer.files); }
});

/* ---------------- start ---------------- */
S.token = store.get('cms_token');
if (S.token) boot(); else showLogin();
})();
</script>
