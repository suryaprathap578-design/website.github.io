<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Conical tensile membrane canopies over a plaza</title>
  <desc id="d">Illustration of three conical PVC tensile fabric canopies on central masts with scalloped edges — tensile fabric structure design by SUBHA INFRA.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F4B66"/><stop offset=".45" stop-color="#8E8EA0"/><stop offset=".78" stop-color="#E7B98A"/><stop offset="1" stop-color="#F4DDBE"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFAF97"/><stop offset="1" stop-color="#8C7D68"/></linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".42" stop-color="#F6F3EE"/><stop offset=".7" stop-color="#D8D3CB"/><stop offset="1" stop-color="#B9B3AA"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".9" r=".6"><stop offset="0" stop-color="#FFE3B0" stop-opacity=".55"/><stop offset="1" stop-color="#FFE3B0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- city skyline -->
  <g fill="#6E6A78" opacity=".55"><rect x="0" y="470" width="120" height="200"/><rect x="130" y="420" width="90" height="250"/><rect x="230" y="500" width="140" height="170"/><rect x="1240" y="440" width="110" height="230"/><rect x="1360" y="490" width="120" height="180"/><rect x="1490" y="400" width="110" height="270"/></g>
  <g fill="#FFD99C" opacity=".55"><rect x="150" y="450" width="10" height="14"/><rect x="180" y="490" width="10" height="14"/><rect x="1260" y="470" width="10" height="14"/><rect x="1510" y="440" width="10" height="14"/><rect x="1530" y="520" width="10" height="14"/></g>
  <rect y="660" width="1600" height="340" fill="url(#ground)"/>
  <rect y="560" width="1600" height="440" fill="url(#glow)"/>
  <g stroke="#A99880" stroke-width="2" opacity=".7"><path d="M0 720H1600M0 810H1600M0 930H1600M800 660L0 1000M800 660L1600 1000M800 660L800 1000"/></g>
  <!-- shadows -->
  <g fill="#3C3226" opacity=".18"><ellipse cx="300" cy="790" rx="240" ry="34"/><ellipse cx="800" cy="800" rx="250" ry="36"/><ellipse cx="1300" cy="790" rx="240" ry="34"/></g>
  <!-- perimeter posts -->
  <g stroke="#232B35" stroke-width="10" stroke-linecap="round"><path d="M55 470V780M555 470V790M1055 470V790M1545 470V780"/></g>
  <!-- cones -->
  <g stroke="#6B6459" stroke-width="2.5">
    <path d="M285 205 C240 330 130 430 55 470 Q175 432 300 492 Q425 432 555 470 C470 430 360 330 315 205Z" fill="url(#cone)"/>
    <path d="M785 185 C740 320 630 430 555 470 Q675 436 800 500 Q925 436 1055 470 C970 430 860 320 815 185Z" fill="url(#cone)"/>
    <path d="M1285 205 C1240 330 1130 430 1055 470 Q1175 432 1300 492 Q1425 432 1545 470 C1470 430 1360 330 1315 205Z" fill="url(#cone)"/>
  </g>
  <!-- seams -->
  <g stroke="#CFC8BD" stroke-width="1.3" fill="none" opacity=".9">
    <path d="M292 210Q230 360 150 452M300 210Q300 360 300 488M308 210Q370 360 450 452"/>
    <path d="M792 190Q730 350 650 456M800 190Q800 350 800 496M808 190Q870 350 950 456"/>
    <path d="M1292 210Q1230 360 1150 452M1300 210Q1300 360 1300 488M1308 210Q1370 360 1450 452"/>
  </g>
  <!-- top rings and masts -->
  <g fill="#232B35"><ellipse cx="300" cy="205" rx="17" ry="6"/><ellipse cx="800" cy="185" rx="17" ry="6"/><ellipse cx="1300" cy="205" rx="17" ry="6"/></g>
  <g stroke="#232B35" stroke-width="12" stroke-linecap="round"><path d="M300 150V800M800 130V810M1300 150V800"/></g>
  <!-- warm downlights -->
  <g fill="#FFE2A8" opacity=".85"><circle cx="300" cy="500" r="6"/><circle cx="800" cy="508" r="6"/><circle cx="1300" cy="500" r="6"/></g>
  <!-- seating & people -->
  <g fill="#3A3128" opacity=".8"><rect x="200" y="740" width="70" height="12"/><rect x="330" y="740" width="70" height="12"/><rect x="700" y="752" width="70" height="12"/><rect x="830" y="752" width="70" height="12"/><rect x="1200" y="740" width="70" height="12"/><rect x="1330" y="740" width="70" height="12"/></g>
  <g fill="#2B2F38" opacity=".85"><circle cx="452" cy="742" r="9"/><rect x="443" y="752" width="18" height="46" rx="7"/><circle cx="1012" cy="752" r="9"/><rect x="1003" y="762" width="18" height="46" rx="7"/><circle cx="1040" cy="758" r="8"/><rect x="1032" y="767" width="16" height="40" rx="6"/></g>
</svg>
